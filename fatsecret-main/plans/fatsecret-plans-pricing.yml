note: >-
  Replaced the 2026-05-04 bulk-sweep scaffold (Free/Professional/Enterprise with invented 1,000
  req/month and 10 req/min figures) with the three editions fatsecret actually publishes. The
  scaffold was wrong in every dimension: fatsecret's free tier is 5,000 calls/DAY, its paid tiers are
  explicitly "Unlimited" on calls and priced on MARKET ACCESS rather than volume, and there is no
  per-minute rate and no overage price anywhere in the published model.
