description: >-
  fatsecret sells the Platform API in three editions. Price is a function of dataset breadth (US-only
  versus 58+ countries), attribution obligation, white-labeling and support level — not of call
  volume, which is capped only on the free Basic edition. Image Recognition and NLP are add-ons on
  every edition. Only the Basic edition is self-serve; both Premier editions require verification or
  a sales conversation.
pricing_axis: market access and dataset breadth, not call volume
