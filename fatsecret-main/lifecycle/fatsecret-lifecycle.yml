      current: v1
      path: /food/barcode/find-by-id/v1
  docs: https://platform.fatsecret.com/docs/guides
  note: >-
    There is no global API version. Older generations of a method remain callable alongside the
    newest, which is a de-facto additive policy — but it is a practice, not a published one.
