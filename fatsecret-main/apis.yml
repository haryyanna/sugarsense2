aid: fatsecret
name: fatsecret
description: >-
  fatsecret is a global nutrition and wellness platform whose Platform API exposes a verified database of more than 2.3
  million foods across 58 countries and 26 languages, plus recipes, exercises, image recognition, natural language
  processing, and user-scoped food diary, exercise diary, and weight tracking. The API is used by more than 50,000
  developers and serves over 700 million calls per month. Bootstrapped and profitable since 2006, fatsecret has never
  raised venture funding.
