note: >-
  fatsecret ships a hosted, no-signup API Demo rather than a sandbox environment. There is no
  test-vs-live key separation, no test mode, and no separate sandbox host — the demo calls the live
  catalog on fatsecret's own credentials and is the only way to exercise the API before registering.
  Profile-scoped methods (diary, weight, saved meals) are NOT exercisable in the demo, because they
  need a 3-legged OAuth 1.0a member authorization.
