generated: '2026-08-12'
method: searched
source: https://platform.fatsecret.com/docs/guides/libraries
docs: https://platform.fatsecret.com/docs/guides/libraries
finding: >-
  fatsecret publishes NO first-party client library in any package registry. Its own Libraries page
  lists only a Postman collection as fatsecret-published, and then explicitly disclaims the rest:
  "below is a list of third party libraries that are not affiliated with fatsecret but maintained by
  the fatsecret developer community." Every wrapper below is community-maintained, and the two the
  provider itself links are 5 and 7 years stale. For a platform serving 700M+ calls/month across
  35,000+ developers, the absence of an official SDK is the single largest ergonomics gap.
official_sdk_count: 0
packages:
  - language: json
    registry: github
    name: postman-fatsecret-apis
    url: https://github.com/fatsecret-group/postman-fatsecret-apis
    install: git clone https://github.com/fatsecret-group/postman-fatsecret-apis
    official: true
    kind: postman-collection
    version: null
    published: '2025-07-01'
    note: >-
      Not a client library and not a registry package — a Postman collection repo published by the
      fatsecret GitHub org. version is null because GitHub tags no releases on this repo; published
      is the last push date read from the GitHub API.
  - language: python
    registry: pypi
    name: pyfatsecret
    url: https://pypi.org/project/pyfatsecret/
    install: pip install pyfatsecret
    official: false
    version: 0.2.0
    published: '2025-11-28'
    source_code: https://github.com/misrolox/pyfatsecret
    note: >-
      Community library linked from the provider's own Libraries page (which points at the
      walexnelson fork; PyPI metadata points at misrolox). Most recently released community wrapper.
  - language: python
    registry: pypi
    name: fatsecret
    url: https://pypi.org/project/fatsecret/
    install: pip install fatsecret
    official: false
    version: 4.0.10
    published: '2026-08-09'
    source_code: https://github.com/ChocoTonic/fatsecret
    note: >-
      Community library, not linked from the provider docs, but the most actively maintained Python
      wrapper found in any registry.
  - language: php
    registry: packagist
    name: braunson/fatsecret-laravel
    url: https://packagist.org/packages/braunson/fatsecret-laravel
    install: composer require braunson/fatsecret-laravel
    official: false
    version: 5.1.0
    published: '2019-12-22'
    source_code: https://github.com/Braunson/fatsecret-laravel
    note: >-
      Linked from the provider's Libraries page. Last release 2019 — predates the v3/v4/v5 method
      generations the current API ships, so it cannot cover the documented surface.
  - language: swift
    registry: cdn
    name: FatSecretSwift
    url: https://github.com/NicholasBellucci/FatSecretSwift
    install: Swift Package Manager — https://github.com/NicholasBellucci/FatSecretSwift
    official: false
    version: null
    published: null
    note: >-
      Distributed as a Swift Package straight from GitHub, so there is no registry metadata endpoint
      to query and no pinned version in the provider's link — a consumer cannot tell what they get.
      The provider's own Libraries page carries the author's caveat that it "should ONLY be used as a
      PROOF OF CONCEPT" because of how it stores credentials.
  - language: javascript
    registry: npm
    name: fatsecret.js
    url: https://www.npmjs.com/package/fatsecret.js
    install: npm install fatsecret.js
    official: false
    version: 1.0.9
    published: '2022-10-02'
    source_code: https://github.com/IDontLua/fatsecret.js
  - language: javascript
    registry: npm
    name: fatsecret
    url: https://www.npmjs.com/package/fatsecret
    install: npm install fatsecret
    official: false
    version: 1.0.2
    published: '2017-05-31'
    source_code: https://github.com/OverFlow636/fatsecret
    note: Abandoned — last release 2017, predates the OAuth 2.0 client_credentials flow entirely.
