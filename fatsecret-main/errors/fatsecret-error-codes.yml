format: vendor-envelope
rfc9457: false
note: >-
  fatsecret does not use RFC 9457 problem+json. Every Platform API method can return a vendor error
  envelope carrying a numeric code and a message, in place of the expected result, and the transport
  status is not the error signal — the body is. Agents must parse the envelope, not the HTTP status.
envelope:
  json:
    example: '{"error": {"code": NUMBER, "message": "TEXT"}}'
    fields:
      - path: error.code
        type: integer
        description: numeric fatsecret error code
      - path: error.message
        type: string
        description: human-readable message, often with a '<details>' suffix naming the offending value
  xml:
    namespace: http://platform.fatsecret.com/api/1.0/
    example: '<error xmlns="http://platform.fatsecret.com/api/1.0/"><code>NUMBER</code><message>TEXT</message></error>'
