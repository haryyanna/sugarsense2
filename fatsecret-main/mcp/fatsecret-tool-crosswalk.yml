source: >-
  https://github.com/fliptheweb/fatsecret-mcp (published tool list, read from the repo README) bound
  to operationIds verified in openapi/*.yml
note: >-
  fatsecret ships no first-party MCP server, so this crosswalk binds the most complete COMMUNITY
  server's tool surface to the provider's REST operations. It is recorded because it is the only
  agent-facing projection of this API that exists, and because the divergence is the finding: the
  community server exposes 40+ tools against documented Platform API methods that the catalog's
  refined OpenAPI does not yet carry (edit/delete/copy diary entries, favorite recipes, most/recently
  eaten foods, saved-meal items, exercise templates, profile, custom-food creation). Input schemas
  were not introspected live — the server is local-stdio and requires the operator's own consumer
  key — so every binding is by name and documented semantics, and confidence is set accordingly.
