overlay: 1.0.0
info:
  title: API Evangelist enhancements for fatsecret Recipes API
  version: 1.0.0
extends: openapi/fatsecret-recipes-api-openapi.yml
x-provenance:
  generated: '2026-08-12'
  method: generated
  source: openapi/fatsecret-recipes-api-openapi.yml + the searched artifacts in this repo
  note: >-
    Captures API Evangelist enhancements as an Overlay so the harvested OpenAPI is never mutated.
    Every value below is traceable to a probed or searched artifact in this repo.
actions:
  - target: $.info
    update:
      x-apievangelist-provider: fatsecret
      x-apievangelist-artifacts:
        conventions: conventions/fatsecret-conventions.yml
        errors: errors/fatsecret-error-codes.yml
        authentication: authentication/fatsecret-authentication.yml
        scopes: scopes/fatsecret-scopes.yml
        lifecycle: lifecycle/fatsecret-lifecycle.yml
        rate_limits: rate-limits/fatsecret-rate-limits.yml
        plans: plans/fatsecret-plans-pricing.yml
        data_model: data-model/fatsecret-data-model.yml
        sandbox: sandbox/fatsecret-sandbox.yml
      x-response-format-default: xml
      x-response-format-parameter: format
      x-idempotency-supported: false
      x-rate-limit-headers: false
      x-error-envelope: '{"error": {"code": NUMBER, "message": "TEXT"}}'
      x-error-codes-docs: https://platform.fatsecret.com/docs/guides/error-codes
  - target: $.servers[0]
    update:
      x-console: https://platform.fatsecret.com/api-demo
  - target: $.components.securitySchemes.oauth2
    update:
      x-scopes-documented:
        - basic
        - premier
        - barcode
        - localization
        - nlp
        - image-recognition
        - feedback
      x-scopes-docs: https://platform.fatsecret.com/docs/guides/authentication/oauth2
      x-openid-configuration: https://oauth.fatsecret.com/.well-known/openid-configuration
      x-token-lifetime-hours: 24
